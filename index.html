<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoAlerta - Monitoramento Ambiental (Firebase API)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // SUAS CHAVES REAIS DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBF5Wjcj2yZ0O68HHMlT73CPmhqTNJDC9A",
            authDomain: "eco-alertas.firebaseapp.com",
            projectId: "eco-alertas",
            storageBucket: "eco-alertas.firebasestorage.app",
            messagingSenderId: "92408617991",
            appId: "1:92408617991:web:3d50d53831b026dff95ea2",
            measurementId: "G-KBEVK2C1Z7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.updateDoc = updateDoc;
        window.onSnapshot = onSnapshot;

        // Inicia o app ouvindo o Firestore em tempo real
        window.iniciarAppFirebase();
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { eco: { 900: '#064e3b', 950: '#022c22' } } }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-slate-950 via-[#061a12] to-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col pb-24 selection:bg-emerald-500 selection:text-slate-950">

    <!-- CABEÇALHO -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-emerald-500/20 px-4 py-4 sticky top-0 z-50 flex justify-between items-center shadow-xl">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-tr from-emerald-600 to-emerald-400 p-2.5 rounded-2xl text-slate-950 font-bold shadow-lg shadow-emerald-500/20">🌿</div>
            <div>
                <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-2">
                    EcoAlerta <span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2.5 py-0.5 rounded-full border border-emerald-500/30 font-medium">Cloud API</span>
                </h1>
                <p class="text-[11px] text-emerald-400/80 font-medium">Sincronizado com Firebase</p>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">

        <!-- MÉTRICAS -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 p-4 rounded-3xl shadow-lg">
                <span class="text-[11px] text-slate-400 font-medium uppercase tracking-wider">Total Registros</span>
                <div id="stat-total" class="text-3xl font-extrabold text-white mt-1">0</div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 p-4 rounded-3xl shadow-lg">
                <span class="text-[11px] text-slate-400 font-medium uppercase tracking-wider">Críticos / Altos</span>
                <div id="stat-criticos" class="text-3xl font-extrabold text-red-400 mt-1">0</div>
            </div>
        </div>

        <!-- FORMULÁRIO COM CLASSIFICAÇÃO INTELIGENTE DE TEXTO -->
        <section class="bg-slate-900/70 backdrop-blur-xl border border-slate-800/80 p-5 rounded-3xl shadow-xl space-y-4">
            <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                <h2 class="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-2">
                    <span class="bg-emerald-500/10 p-1.5 rounded-xl text-emerald-400">⚠️</span> Nova Ocorrência
                </h2>
                <span id="preview-tag-ia" class="text-[10px] px-3 py-1 rounded-full border bg-emerald-500/10 text-emerald-400 border-emerald-500/30 font-semibold transition-all">
                    🤖 IA Pronta
                </span>
            </div>

            <form id="form-alerta" onsubmit="salvarOcorrenciaFirebase(event)" class="space-y-3.5">
                <div>
                    <label class="block text-[11px] text-slate-400 font-medium mb-1">Título / Tipo de Ocorrência</label>
                    <input type="text" id="input-tipo" required placeholder="Ex: Vazamento de esgoto, Fogo" class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-emerald-500 transition shadow-inner">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 font-medium mb-1">Localização</label>
                    <input type="text" id="input-local" required placeholder="Ex: Rua das Flores, Centro" class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-emerald-500 transition shadow-inner">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 font-medium mb-1">Descrição (Classificação em Tempo Real)</label>
                    <textarea id="input-descricao" rows="2" required oninput="testarClassificacaoTempoReal()" placeholder="Descreva os detalhes..." class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-emerald-500 transition shadow-inner resize-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-slate-950 font-bold text-xs py-3.5 rounded-2xl transition shadow-lg shadow-emerald-600/20 active:scale-[0.98]">
                    Enviar para Nuvem (API)
                </button>
            </form>
        </section>

        <!-- FEED EM TEMPO REAL -->
        <section class="bg-slate-900/70 backdrop-blur-xl border border-slate-800/80 p-5 rounded-3xl shadow-xl space-y-4">
            <h3 class="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-2">
                <span class="bg-emerald-500/10 p-1.5 rounded-xl text-emerald-400">📜</span> Feed em Tempo Real
            </h3>
            <div id="feed-container" class="space-y-3">
                <p class="text-xs text-slate-500 text-center py-6">Conectando à API do Firebase...</p>
            </div>
        </section>
    </main>

    <!-- SCRIPTS DE LÓGICA E FIREBASE -->
    <script>
        let registrosCache = [];

        function classificarSeveridade(textoCompleto) {
            if (!textoCompleto) return { nivel: 'Baixo', cor: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' };
            const texto = textoCompleto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            const criticas = ['vazamento', 'incendio', 'fogo', 'explosao', 'toxico', 'envenenamento', 'morte', 'emergencia', 'esgoto', 'quimico'];
            const altas = ['desmatamento', 'lixo', 'poluicao', 'oleo', 'fumaca', 'cheiro', 'contaminacao', 'buraco', 'entulho', 'residuo'];

            for (let p of criticas) if (texto.includes(p)) return { nivel: 'Crítico', cor: 'bg-red-500/10 text-red-400 border-red-500/30' };
            for (let p of altas) if (texto.includes(p)) return { nivel: 'Alto', cor: 'bg-orange-500/10 text-orange-400 border-orange-500/30' };
            return { nivel: 'Baixo', cor: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' };
        }

        function testarClassificacaoTempoReal() {
            const titulo = document.getElementById('input-tipo').value;
            const desc = document.getElementById('input-descricao').value;
            const res = classificarSeveridade(titulo + " " + desc);
            const badge = document.getElementById('preview-tag-ia');
            badge.className = `text-[10px] px-3 py-1 rounded-full border font-semibold ${res.cor} transition-all`;
            badge.innerText = `🤖 IA: ${res.nivel}`;
        }

        window.iniciarAppFirebase = function() {
            window.onSnapshot(window.collection(window.db, "ocorrencias"), (snapshot) => {
                registrosCache = [];
                snapshot.forEach((docSnap) => {
                    registrosCache.push({ id: docSnap.id, ...docSnap.data() });
                });
                atualizarInterface();
            });
        }

        async function salvarOcorrenciaFirebase(e) {
            e.preventDefault();
            const tipo = document.getElementById('input-tipo').value;
            const local = document.getElementById('input-local').value;
            const descricao = document.getElementById('input-descricao').value;
            const classificacao = classificarSeveridade(tipo + " " + descricao);

            try {
                await window.addDoc(window.collection(window.db, "ocorrencias"), {
                    tipo,
                    local,
                    descricao,
                    severidade: classificacao.nivel,
                    data: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + ' - ' + new Date().toLocaleDateString('pt-BR'),
                    timestamp: Date.now()
                });
                document.getElementById('form-alerta').reset();
                document.getElementById('preview-tag-ia').className = "text-[10px] px-3 py-1 rounded-full border bg-emerald-500/10 text-emerald-400 border-emerald-500/30 font-semibold";
                document.getElementById('preview-tag-ia').innerText = "🤖 IA Pronta";
            } catch (erro) {
                alert("Erro ao enviar para a nuvem. Verifique o console.");
                console.error(erro);
            }
        }

        async function excluirRegistroFirebase(id) {
            await window.deleteDoc(window.doc(window.db, "ocorrencias", id));
        }

        function atualizarInterface() {
            const container = document.getElementById('feed-container');
            const statTotal = document.getElementById('stat-total');
            const statCriticos = document.getElementById('stat-criticos');

            statTotal.innerText = registrosCache.length;
            statCriticos.innerText = registrosCache.filter(r => r.severidade === 'Crítico' || r.severidade === 'Alto').length;

            if (registrosCache.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">Nenhum registro na nuvem.</p>`;
                return;
            }

            container.innerHTML = registrosCache.map(r => {
                let corBadge = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
                if (r.severidade === 'Crítico') corBadge = 'bg-red-500/10 text-red-400 border-red-500/30';
                if (r.severidade === 'Alto') corBadge = 'bg-orange-500/10 text-orange-400 border-orange-500/30';

                return `
                    <div class="bg-slate-950/60 border border-slate-800/80 p-3.5 rounded-2xl space-y-2 shadow-md">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="text-xs font-bold text-white">${r.tipo}</h4>
                                <span class="text-[10px] text-emerald-400/80 font-medium">📍 ${r.local}</span>
                            </div>
                            <span class="px-2.5 py-1 rounded-xl text-[10px] font-semibold border ${corBadge}">${r.severidade}</span>
                        </div>
                        <p class="text-[11px] text-slate-300">${r.descricao}</p>
                        <div class="flex justify-between items-center pt-2 border-t border-slate-800/60 text-[10px] text-slate-500">
                            <span>🕒 ${r.data}</span>
                            <button onclick="excluirRegistroFirebase('${r.id}')" class="text-red-400 hover:text-red-300 font-medium">Excluir</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
                        </html>
