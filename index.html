<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoAlerta - Monitoramento Ambiental</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        eco: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#064e3b',
                            950: '#022c22'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#07130d] text-slate-100 font-sans antialiased min-h-screen flex flex-col pb-24">

    <!-- CABEÇALHO -->
    <header class="bg-[#0f2318] border-b border-[#1b3a2a] px-4 py-3.5 sticky top-0 z-40 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-2.5">
            <div class="bg-emerald-500/10 border border-emerald-500/30 p-2 rounded-xl text-emerald-400 font-bold text-base">🌿</div>
            <div>
                <h1 class="text-sm font-bold tracking-wide text-white flex items-center gap-1.5">
                    EcoAlerta <span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/30">v2.4</span>
                </h1>
                <p class="text-[10px] text-slate-400">GreenPulse Engine • IA Ativa</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- NOTIFICAÇÕES -->
            <div class="relative">
                <button onclick="alternarNotificacoes()" class="p-2 bg-[#142f21] border border-[#224a35] rounded-xl text-slate-300 relative">
                    🔔
                    <span id="badge-notif" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-bold w-4 h-4 flex items-center justify-center rounded-full">0</span>
                </button>
                <div id="painel-notif" class="hidden absolute right-0 mt-2 w-72 bg-[#0f2318] border border-[#1b3a2a] rounded-2xl shadow-2xl z-50 overflow-hidden text-xs">
                    <div class="p-3 border-b border-[#1b3a2a] flex justify-between items-center bg-[#142f21]">
                        <span class="font-bold text-white">Notificações</span>
                        <button onclick="limparNotificacoes()" class="text-[10px] text-emerald-400 hover:underline">Limpar</button>
                    </div>
                    <ul id="lista-notif" class="max-h-56 overflow-y-auto divide-y divide-[#1b3a2a]">
                        <li class="p-3 text-slate-400 text-center">Nenhuma notificação.</li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 max-w-lg w-full mx-auto p-4 space-y-4">

        <!-- CARTÕES DE ESTATÍSTICAS -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-[#0f2318] border border-[#1b3a2a] p-3.5 rounded-2xl shadow-sm">
                <span class="text-[10px] text-slate-400 font-medium">Total Registros</span>
                <div id="stat-total" class="text-xl font-bold text-white mt-1">0</div>
            </div>
            <div class="bg-[#0f2318] border border-[#1b3a2a] p-3.5 rounded-2xl shadow-sm">
                <span class="text-[10px] text-slate-400 font-medium">Alertas Críticos</span>
                <div id="stat-criticos" class="text-xl font-bold text-red-400 mt-1">0</div>
            </div>
        </div>

        <!-- FORMULÁRIO DE CADASTRO -->
        <section id="secao-registrar" class="bg-[#0f2318] border border-[#1b3a2a] p-4 rounded-2xl shadow-md">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-1.5">
                    <span>⚠️</span> Registar Ocorrência
                </h2>
                <span id="preview-tag-ia" class="text-[10px] px-2.5 py-0.5 rounded-full border bg-emerald-500/10 text-emerald-400 border-emerald-500/30">
                    IA: Aguardando...
                </span>
            </div>

            <form id="form-alerta" onsubmit="salvarOcorrencia(event)" class="space-y-3">
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Título / Tipo de Ocorrência</label>
                    <input type="text" id="input-tipo" required placeholder="Ex: Incêndio, Vazamento" class="w-full bg-[#07130d] border border-[#1b3a2a] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Localização</label>
                    <input type="text" id="input-local" required placeholder="Ex: Rua Principal, Centro" class="w-full bg-[#07130d] border border-[#1b3a2a] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Descrição (Analisada pela IA)</label>
                    <textarea id="input-descricao" rows="2" required oninput="testarClassificacaoTempoReal()" placeholder="Descreva o incidente..." class="w-full bg-[#07130d] border border-[#1b3a2a] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-2.5 rounded-xl transition shadow-lg shadow-emerald-900/40">
                    Publicar Alerta
                </button>
            </form>
        </section>

        <!-- HISTÓRICO / FEED -->
        <section id="secao-historico" class="bg-[#0f2318] border border-[#1b3a2a] p-4 rounded-2xl shadow-md space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-1.5">
                    <span>📜</span> Feed de Ocorrências
                </h3>
                <div class="flex items-center gap-1 overflow-x-auto pb-1">
                    <button onclick="filtrarFeed('Todos')" id="filtro-Todos" class="px-2.5 py-1 rounded-xl text-[10px] font-medium bg-emerald-600 text-white transition">Todos</button>
                    <button onclick="filtrarFeed('Crítico')" id="filtro-Crítico" class="px-2.5 py-1 rounded-xl text-[10px] font-medium bg-[#142f21] text-slate-300 transition">Crítico</button>
                    <button onclick="filtrarFeed('Baixo')" id="filtro-Baixo" class="px-2.5 py-1 rounded-xl text-[10px] font-medium bg-[#142f21] text-slate-300 transition">Baixo</button>
                </div>
            </div>

            <div id="feed-container" class="space-y-2.5">
                <p class="text-[11px] text-slate-500 text-center py-4">Nenhum registro encontrado.</p>
            </div>
        </section>
    </main>

    <!-- NAVEGAÇÃO INFERIOR MOBILE -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#0f2318]/95 backdrop-blur border-t border-[#1b3a2a] p-2.5 px-6 flex justify-around items-center z-40">
        <a href="#secao-registrar" class="flex flex-col items-center text-emerald-400 text-[10px] font-medium">
            <span class="text-base">📊</span> Início
        </a>
        <a href="#secao-registrar" class="flex flex-col items-center text-slate-400 hover:text-white text-[10px] font-medium">
            <span class="text-base">⚠️</span> Registrar
        </a>
        <a href="#secao-historico" class="flex flex-col items-center text-slate-400 hover:text-white text-[10px] font-medium">
            <span class="text-base">📜</span> Histórico
        </a>
    </nav>

    <!-- SCRIPTS -->
    <script>
        let registros = JSON.parse(localStorage.getItem('eco_registros_v3')) || [];
        let notificacoes = JSON.parse(localStorage.getItem('eco_notif_v3')) || [];
        let filtroAtual = 'Todos';

        function classificarSeveridade(textoCompleto) {
            if (!textoCompleto) return { nivel: 'Baixo', cor: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' };

            const texto = textoCompleto
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "");

            const criticas = ['vazamento', 'incendio', 'fogo', 'explosao', 'toxico', 'envenenamento', 'morte', 'emergencia', 'esgoto', 'quimico'];
            const altas = ['desmatamento', 'lixo', 'poluicao', 'oleo', 'fumaca', 'cheiro', 'contaminacao', 'buraco', 'entulho', 'residuo'];

            for (let p of criticas) {
                if (texto.includes(p)) {
                    return { nivel: 'Crítico', cor: 'bg-red-500/10 text-red-400 border-red-500/30' };
                }
            }

            for (let p of altas) {
                if (texto.includes(p)) {
                    return { nivel: 'Alto', cor: 'bg-orange-500/10 text-orange-400 border-orange-500/30' };
                }
            }

            return { nivel: 'Baixo', cor: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' };
        }

        function testarClassificacaoTempoReal() {
            const titulo = document.getElementById('input-tipo').value;
            const desc = document.getElementById('input-descricao').value;
            const res = classificarSeveridade(titulo + " " + desc);
            const badge = document.getElementById('preview-tag-ia');
            badge.className = `text-[10px] px-2.5 py-0.5 rounded-full border font-semibold ${res.cor}`;
            badge.innerText = `IA: ${res.nivel}`;
        }

        function salvarOcorrencia(e) {
            e.preventDefault();
            const tipo = document.getElementById('input-tipo').value;
            const local = document.getElementById('input-local').value;
            const descricao = document.getElementById('input-descricao').value;

            const classificacao = classificarSeveridade(tipo + " " + descricao);

            const novoRegistro = {
                id: Date.now(),
                tipo,
                local,
                descricao,
                severidade: classificacao.nivel,
                data: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + ' - ' + new Date().toLocaleDateString('pt-BR')
            };

            registros.unshift(novoRegistro);
            localStorage.setItem('eco_registros_v3', JSON.stringify(registros));
            adicionarNotificacao('Nova Ocorrência', `"${tipo}" classificado como ${classificacao.nivel}.`);
            
            document.getElementById('form-alerta').reset();
            document.getElementById('preview-tag-ia').className = "text-[10px] px-2.5 py-0.5 rounded-full border bg-emerald-500/10 text-emerald-400 border-emerald-500/30";
            document.getElementById('preview-tag-ia').innerText = "IA: Aguardando...";

            atualizarPainel();
        }

        function mudarSeveridadeManual(id, novaSev) {
            const reg = registros.find(r => r.id === id);
            if (reg) {
                reg.severidade = novaSev;
                localStorage.setItem('eco_registros_v3', JSON.stringify(registros));
                atualizarPainel();
            }
        }

        function excluirRegistro(id) {
            registros = registros.filter(r => r.id !== id);
            localStorage.setItem('eco_registros_v3', JSON.stringify(registros));
            atualizarPainel();
        }

        function filtrarFeed(nivel) {
            filtroAtual = nivel;
            ['Todos', 'Crítico', 'Baixo'].forEach(n => {
                const btn = document.getElementById(`filtro-${n}`);
                if (btn) {
                    btn.className = n === nivel ? "px-2.5 py-1 rounded-xl text-[10px] font-medium bg-emerald-600 text-white transition" : "px-2.5 py-1 rounded-xl text-[10px] font-medium bg-[#142f21] text-slate-300 transition";
                }
            });
            atualizarPainel();
        }

        function atualizarPainel() {
            const container = document.getElementById('feed-container');
            const statTotal = document.getElementById('stat-total');
            const statCriticos = document.getElementById('stat-criticos');

            statTotal.innerText = registros.length;
            statCriticos.innerText = registros.filter(r => r.severidade === 'Crítico' || r.severidade === 'Alto').length;

            let filtrados = registros;
            if (filtroAtual !== 'Todos') {
                filtrados = registros.filter(r => r.severidade === filtroAtual);
            }

            if (filtrados.length === 0) {
                container.innerHTML = `<p class="text-[11px] text-slate-500 text-center py-4">Nenhum registro encontrado.</p>`;
                return;
            }

            container.innerHTML = filtrados.map(r => {
                let corBadge = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
                if (r.severidade === 'Crítico') corBadge = 'bg-red-500/10 text-red-400 border-red-500/30';
                if (r.severidade === 'Alto') corBadge = 'bg-orange-500/10 text-orange-400 border-orange-500/30';

                return `
                    <div class="bg-[#07130d] border border-[#1b3a2a] p-3 rounded-xl space-y-1.5">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="text-xs font-bold text-white">${r.tipo}</h4>
                                <span class="text-[10px] text-slate-400">📍 ${r.local}</span>
                            </div>
                            <select onchange="mudarSeveridadeManual(${r.id}, this.value)" class="px-2 py-0.5 rounded-lg text-[10px] font-semibold border ${corBadge} bg-[#0f2318] outline-none cursor-pointer">
                                <option value="Crítico" ${r.severidade === 'Crítico' ? 'selected' : ''}>Crítico</option>
                                <option value="Alto" ${r.severidade === 'Alto' ? 'selected' : ''}>Alto</option>
                                <option value="Baixo" ${r.severidade === 'Baixo' ? 'selected' : ''}>Baixo</option>
                            </select>
                        </div>
                        <p class="text-[11px] text-slate-300">${r.descricao}</p>
                        <div class="flex justify-between items-center pt-1 border-t border-[#1b3a2a]/50 text-[9px] text-slate-500">
                            <span>🕒 ${r.data}</span>
                            <button onclick="excluirRegistro(${r.id})" class="text-red-400 hover:underline">Excluir</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function adicionarNotificacao(titulo, mensagem) {
            notificacoes.unshift({ titulo, mensagem, hora: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) });
            localStorage.setItem('eco_notif_v3', JSON.stringify(notificacoes));
            atualizarNotificacoesUI();
        }

        function atualizarNotificacoesUI() {
            const badge = document.getElementById('badge-notif');
            const lista = document.getElementById('lista-notif');
            if (notificacoes.length > 0) {
                badge.innerText = notificacoes.length;
                badge.classList.remove('hidden');
                lista.innerHTML = notificacoes.map(n => `
                    <li class="p-2.5 hover:bg-[#142f21]">
                        <div class="flex justify-between font-bold text-emerald-400 mb-0.5">
                            <span>${n.titulo}</span>
                            <span class="text-[9px] text-slate-500">${n.hora}</span>
                        </div>
                        <p class="text-slate-300 text-[11px]">${n.mensagem}</p>
                    </li>
                `).join('');
            }
        }

        function alternarNotificacoes() {
            document.getElementById('painel-notif').classList.toggle('hidden');
        }

        function limparNotificacoes() {
            notificacoes = [];
            localStorage.setItem('eco_notif_v3', JSON.stringify(notificacoes));
            atualizarNotificacoesUI();
        }

        atualizarPainel();
        atualizarNotificacoesUI();
    </script>
</body>
</html>
