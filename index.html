<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoAlerta - Monitoramento Ambiental</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        eco: { 900: '#064e3b', 950: '#022c22' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-slate-950 via-[#061a12] to-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col pb-24 selection:bg-emerald-500 selection:text-slate-950">

    <!-- CABEÇALHO ELEGANTE -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-emerald-500/20 px-4 py-4 sticky top-0 z-50 flex justify-between items-center shadow-xl">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-tr from-emerald-600 to-emerald-400 p-2.5 rounded-2xl text-slate-950 font-bold shadow-lg shadow-emerald-500/20">🌿</div>
            <div>
                <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-2">
                    EcoAlerta <span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2.5 py-0.5 rounded-full border border-emerald-500/30 font-medium">Engine v2.4</span>
                </h1>
                <p class="text-[11px] text-emerald-400/80 font-medium">Monitoramento Inteligente & IA</p>
            </div>
        </div>

        <div class="relative">
            <button onclick="alternarNotificacoes()" class="p-2.5 bg-slate-800/80 border border-slate-700/80 hover:border-emerald-500/50 rounded-2xl text-slate-200 transition shadow-md relative">
                🔔
                <span id="badge-notif" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-bold w-4 h-4 flex items-center justify-center rounded-full shadow-md">0</span>
            </button>
            <div id="painel-notif" class="hidden absolute right-0 mt-3 w-80 bg-slate-900 border border-slate-700/80 rounded-3xl shadow-2xl z-50 overflow-hidden text-xs backdrop-blur-xl">
                <div class="p-3.5 border-b border-slate-800 flex justify-between items-center bg-slate-800/50">
                    <span class="font-bold text-white">Notificações</span>
                    <button onclick="limparNotificacoes()" class="text-[11px] text-emerald-400 hover:underline">Limpar</button>
                </div>
                <ul id="lista-notif" class="max-h-60 overflow-y-auto divide-y divide-slate-800">
                    <li class="p-4 text-slate-400 text-center">Nenhuma notificação recente.</li>
                </ul>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">

        <!-- CARDS DE MÉTRICAS -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 p-4 rounded-3xl shadow-lg relative overflow-hidden group hover:border-emerald-500/30 transition">
                <div class="absolute -right-4 -bottom-4 w-16 h-16 bg-emerald-500/5 rounded-full blur-xl"></div>
                <span class="text-[11px] text-slate-400 font-medium uppercase tracking-wider">Total Registros</span>
                <div id="stat-total" class="text-3xl font-extrabold text-white mt-1">0</div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 p-4 rounded-3xl shadow-lg relative overflow-hidden group hover:border-red-500/30 transition">
                <div class="absolute -right-4 -bottom-4 w-16 h-16 bg-red-500/5 rounded-full blur-xl"></div>
                <span class="text-[11px] text-slate-400 font-medium uppercase tracking-wider">Críticos / Altos</span>
                <div id="stat-criticos" class="text-3xl font-extrabold text-red-400 mt-1">0</div>
            </div>
        </div>

        <!-- FORMULÁRIO ESTILIZADO -->
        <section id="secao-registrar" class="bg-slate-900/70 backdrop-blur-xl border border-slate-800/80 p-5 rounded-3xl shadow-xl space-y-4">
            <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                <h2 class="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-2">
                    <span class="bg-emerald-500/10 p-1.5 rounded-xl text-emerald-400">⚠️</span> Nova Ocorrência
                </h2>
                <span id="preview-tag-ia" class="text-[10px] px-3 py-1 rounded-full border bg-emerald-500/10 text-emerald-400 border-emerald-500/30 font-semibold transition-all">
                    🤖 IA Pronta
                </span>
            </div>

            <form id="form-alerta" onsubmit="salvarOcorrencia(event)" class="space-y-3.5">
                <div>
                    <label class="block text-[11px] text-slate-400 font-medium mb-1">Título / Tipo de Ocorrência</label>
                    <input type="text" id="input-tipo" required placeholder="Ex: Incêndio na mata, Vazamento" class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-emerald-500 transition shadow-inner">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 font-medium mb-1">Localização</label>
                    <input type="text" id="input-local" required placeholder="Ex: Rua das Flores, Centro" class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-emerald-500 transition shadow-inner">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 font-medium mb-1">Descrição (Classificação em Tempo Real)</label>
                    <textarea id="input-descricao" rows="2" required oninput="testarClassificacaoTempoReal()" placeholder="Descreva os detalhes..." class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-emerald-500 transition shadow-inner resize-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-slate-950 font-bold text-xs py-3.5 rounded-2xl transition shadow-lg shadow-emerald-600/20 active:scale-[0.98]">
                    Publicar Alerta na Nuvem
                </button>
            </form>
        </section>

        <!-- FEED DE HISTÓRICO -->
        <section id="secao-historico" class="bg-slate-900/70 backdrop-blur-xl border border-slate-800/80 p-5 rounded-3xl shadow-xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-2">
                    <span class="bg-emerald-500/10 p-1.5 rounded-xl text-emerald-400">📜</span> Feed Recente
                </h3>
                <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-2xl border border-slate-800">
                    <button onclick="filtrarFeed('Todos')" id="filtro-Todos" class="px-3 py-1 rounded-xl text-[10px] font-bold bg-emerald-500 text-slate-950 transition shadow-sm">Todos</button>
                    <button onclick="filtrarFeed('Crítico')" id="filtro-Crítico" class="px-3 py-1 rounded-xl text-[10px] font-medium text-slate-400 hover:text-white transition">Crítico</button>
                    <button onclick="filtrarFeed('Baixo')" id="filtro-Baixo" class="px-3 py-1 rounded-xl text-[10px] font-medium text-slate-400 hover:text-white transition">Baixo</button>
                </div>
            </div>

            <div id="feed-container" class="space-y-3">
                <p class="text-xs text-slate-500 text-center py-6">Nenhum registro encontrado.</p>
            </div>
        </section>
    </main>

    <!-- NAVEGAÇÃO INFERIOR MOBILE FLUTUANTE -->
    <nav class="fixed bottom-3 left-4 right-4 bg-slate-900/90 backdrop-blur-xl border border-slate-700/80 p-2.5 px-6 rounded-3xl shadow-2xl flex justify-around items-center z-50">
        <a href="#secao-registrar" class="flex flex-col items-center text-emerald-400 text-[10px] font-semibold gap-0.5">
            <span class="text-base">📊</span> Início
        </a>
        <a href="#secao-registrar" class="flex flex-col items-center text-slate-400 hover:text-white text-[10px] font-medium gap-0.5">
            <span class="text-base">⚠️</span> Registrar
        </a>
        <a href="#secao-historico" class="flex flex-col items-center text-slate-400 hover:text-white text-[10px] font-medium gap-0.5">
            <span class="text-base">📜</span> Histórico
        </a>
    </nav>

    <!-- SCRIPT DE INTELIGÊNCIA E PERSISTÊNCIA -->
    <script>
        let registros = JSON.parse(localStorage.getItem('eco_registros_v4')) || [];
        let notificacoes = JSON.parse(localStorage.getItem('eco_notif_v4')) || [];
        let filtroAtual = 'Todos';

        function classificarSeveridade(textoCompleto) {
            if (!textoCompleto) return { nivel: 'Baixo', cor: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' };

            const texto = textoCompleto
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "");

            const criticas = ['vazamento', 'incendio', 'fogo', 'explosao', 'toxico', 'envenenamento', 'morte', 'emergencia', 'esgoto', 'quimico'];
            const altas = ['desmatamento', 'lixo', 'poluicao', 'oleo', 'fumaca', 'cheiro', 'contaminacao', 'buraco', 'entulho', 'residuo'];

            for (let p of criticas) {
                if (texto.includes(p)) {
                    return { nivel: 'Crítico', cor: 'bg-red-500/10 text-red-400 border-red-500/30' };
                }
            }

            for (let p of altas) {
                if (texto.includes(p)) {
                    return { nivel: 'Alto', cor: 'bg-orange-500/10 text-orange-400 border-orange-500/30' };
                }
            }

            return { nivel: 'Baixo', cor: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' };
        }

        function testarClassificacaoTempoReal() {
            const titulo = document.getElementById('input-tipo').value;
            const desc = document.getElementById('input-descricao').value;
            const res = classificarSeveridade(titulo + " " + desc);
            const badge = document.getElementById('preview-tag-ia');
            badge.className = `text-[10px] px-3 py-1 rounded-full border font-semibold ${res.cor} transition-all`;
            badge.innerText = `🤖 IA: ${res.nivel}`;
        }

        function salvarOcorrencia(e) {
            e.preventDefault();
            const tipo = document.getElementById('input-tipo').value;
            const local = document.getElementById('input-local').value;
            const descricao = document.getElementById('input-descricao').value;

            const classificacao = classificarSeveridade(tipo + " " + descricao);

            const novoRegistro = {
                id: Date.now(),
                tipo,
                local,
                descricao,
                severidade: classificacao.nivel,
                data: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + ' - ' + new Date().toLocaleDateString('pt-BR')
            };

            registros.unshift(novoRegistro);
            localStorage.setItem('eco_registros_v4', JSON.stringify(registros));
            adicionarNotificacao('Nova Ocorrência', `"${tipo}" registrado como ${classificacao.nivel}.`);
            
            document.getElementById('form-alerta').reset();
            document.getElementById('preview-tag-ia').className = "text-[10px] px-3 py-1 rounded-full border bg-emerald-500/10 text-emerald-400 border-emerald-500/30 font-semibold";
            document.getElementById('preview-tag-ia').innerText = "🤖 IA Pronta";

            atualizarPainel();
        }

        function mudarSeveridadeManual(id, novaSev) {
            const reg = registros.find(r => r.id === id);
            if (reg) {
                reg.severidade = novaSev;
                localStorage.setItem('eco_registros_v4', JSON.stringify(registros));
                atualizarPainel();
            }
        }

        function excluirRegistro(id) {
            registros = registros.filter(r => r.id !== id);
            localStorage.setItem('eco_registros_v4', JSON.stringify(registros));
            atualizarPainel();
        }

        function filtrarFeed(nivel) {
            filtroAtual = nivel;
            ['Todos', 'Crítico', 'Baixo'].forEach(n => {
                const btn = document.getElementById(`filtro-${n}`);
                if (btn) {
                    btn.className = n === nivel ? "px-3 py-1 rounded-xl text-[10px] font-bold bg-emerald-500 text-slate-950 transition shadow-sm" : "px-3 py-1 rounded-xl text-[10px] font-medium text-slate-400 hover:text-white transition";
                }
            });
            atualizarPainel();
        }

        function atualizarPainel() {
            const container = document.getElementById('feed-container');
            const statTotal = document.getElementById('stat-total');
            const statCriticos = document.getElementById('stat-criticos');

            statTotal.innerText = registros.length;
            statCriticos.innerText = registros.filter(r => r.severidade === 'Crítico' || r.severidade === 'Alto').length;

            let filtrados = registros;
            if (filtroAtual !== 'Todos') {
                filtrados = registros.filter(r => r.severidade === filtroAtual);
            }

            if (filtrados.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">Nenhum registro encontrado.</p>`;
                return;
            }

            container.innerHTML = filtrados.map(r => {
                let corBadge = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
                if (r.severidade === 'Crítico') corBadge = 'bg-red-500/10 text-red-400 border-red-500/30';
                if (r.severidade === 'Alto') corBadge = 'bg-orange-500/10 text-orange-400 border-orange-500/30';

                return `
                    <div class="bg-slate-950/60 border border-slate-800/80 p-3.5 rounded-2xl space-y-2 hover:border-emerald-500/30 transition shadow-md">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="text-xs font-bold text-white">${r.tipo}</h4>
                                <span class="text-[10px] text-emerald-400/80 font-medium">📍 ${r.local}</span>
                            </div>
                            <select onchange="mudarSeveridadeManual(${r.id}, this.value)" class="px-2.5 py-1 rounded-xl text-[10px] font-semibold border ${corBadge} bg-slate-900 outline-none cursor-pointer shadow-sm">
                                <option value="Crítico" ${r.severidade === 'Crítico' ? 'selected' : ''}>Crítico</option>
                                <option value="Alto" ${r.severidade === 'Alto' ? 'selected' : ''}>Alto</option>
                                <option value="Baixo" ${r.severidade === 'Baixo' ? 'selected' : ''}>Baixo</option>
                            </select>
                        </div>
                        <p class="text-[11px] text-slate-300 leading-relaxed">${r.descricao}</p>
                        <div class="flex justify-between items-center pt-2 border-t border-slate-800/60 text-[10px] text-slate-500">
                            <span>🕒 ${r.data}</span>
                            <button onclick="excluirRegistro(${r.id})" class="text-red-400 hover:text-red-300 font-medium transition">Excluir</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function adicionarNotificacao(titulo, mensagem) {
            notificacoes.unshift({ titulo, mensagem, hora: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) });
            localStorage.setItem('eco_notif_v4', JSON.stringify(notificacoes));
            atualizarNotificacoesUI();
        }

        function atualizarNotificacoesUI() {
            const badge = document.getElementById('badge-notif');
            const lista = document.getElementById('lista-notif');
            if (notificacoes.length > 0) {
                badge.innerText = notificacoes.length;
                badge.classList.remove('hidden');
                lista.innerHTML = notificacoes.map(n => `
                    <li class="p-3 hover:bg-slate-800/50 transition">
                        <div class="flex justify-between font-bold text-emerald-400 mb-0.5 text-xs">
                            <span>${n.titulo}</span>
                            <span class="text-[10px] text-slate-500">${n.hora}</span>
                        </div>
                        <p class="text-slate-300 text-[11px]">${n.mensagem}</p>
                    </li>
                `).join('');
            }
        }

        function alternarNotificacoes() {
            document.getElementById('painel-notif').classList.toggle('hidden');
        }

        function limparNotificacoes() {
            notificacoes = [];
            localStorage.setItem('eco_notif_v4', JSON.stringify(notificacoes));
            atualizarNotificacoesUI();
        }

        atualizarPainel();
        atualizarNotificacoesUI();
    </script>
</body>
</html>
